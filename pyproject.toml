[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orggraph"
version = "1.0.0"
description = "Passive OSINT Intelligence & Correlation Framework"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "dnspython>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
orggraph = "orggraph:cli"

[tool.setuptools]
py-modules = ["orggraph"]